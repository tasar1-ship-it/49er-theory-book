<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="49er Theory">
<meta name="theme-color" content="#0A1F4C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="app.css">
<title>Marks</title>
<script>
/* set text size and background before first paint so there is no flash */
try {
  var p = JSON.parse(localStorage.getItem('k49.prefs.v1') || '{}');
  var s = ['17px','20px','23px','26px'][p.size == null ? 1 : p.size];
  document.documentElement.style.setProperty('--fs', s);
  var sysDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  var th = p.theme || (sysDark ? 'dark' : 'light');
  document.addEventListener('DOMContentLoaded', function () {
    document.body.classList.add('t-' + th);
  });
} catch (e) {}
</script>

</head>
<body class="" data-page="marks">
<header class="bar">
  <a class="bar-b" href="./" aria-label="Contents">Contents</a>
  <button class="bar-b bar-t" id="btn-jump" data-chapter="Marks"
          aria-label="Jump to a section"><span class="where">Marks</span><span class="now"></span><span class="caret">▾</span></button>
  <div class="bar-r">
    <button class="bar-b" id="btn-marks" aria-label="My marks">Marks</button>
    <button class="bar-b" id="btn-mode" aria-label="Switch between bright and dark">Dark</button>
    <button class="bar-b" id="btn-read" aria-label="Reading settings">Aa</button>
  </div>
</header>
<main class="wrap">
<h1>My highlights, notes and requests</h1>
<p class="sub">Everything on this page is stored on this iPad only. It is not sent anywhere until you export it.</p>
<div class="marks-tools">
  <button class="btn btn-p" id="mk-email">Email to Ronald</button>
  <button class="btn" id="mk-export">Export</button>
  <button class="btn" id="mk-copy">Copy all</button>
  <select class="btn" id="mk-filter">
    <option value="all">Everything</option>
    <option value="highlight">Highlights only</option>
    <option value="note">Notes only</option>
    <option value="request">Requests only</option>
  </select>
</div>
<div id="mk-list" class="marks-list"></div>

</main>
<script src="data.js"></script>
<script src="app.js"></script>
</body></html>
